name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle wrapper в репозитории не нужен: Gradle ставит сам экшен
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Удаляет файлы, которые из проекта убраны, но могли остаться в репозитории после обновления поверх старой версии
      - name: Remove stale files
        run: rm -fv app/src/main/java/voice/changer/app/PresetPicker.java app/src/main/java/voice/changer/app/M4aWriter.java

      # Быстрые проверки проекта: манифест, ресурсы, строки (падает с понятным сообщением)
      - name: Project checks
        run: |
          if [ -f tools/verify.py ]; then python3 tools/verify.py; else echo "tools/verify.py не найден — загрузите папку tools в репозиторий; проверка пропущена"; fi

      # Тесты звукового ядра (чистая Java, без Android)
      - name: DSP tests
        run: |
          mkdir -p /tmp/dsp
          javac -d /tmp/dsp app/src/main/java/voice/changer/app/dsp/*.java
          if [ -f tests/DspTest.java ]; then java -Dfile.encoding=UTF-8 -cp /tmp/dsp tests/DspTest.java; else echo "tests/DspTest.java не найден — тесты пропущены"; fi

      # MP3: скачивает LAME и собирает libvcmp3.so. Файлы-обёртки записываются здесь же, поэтому достаточно одного build.yml.
      # Если шаг не удался — приложение соберётся без MP3 (его журнал приложен к запуску как lame-log).
      - name: Build MP3 encoder (LAME, optional)
        continue-on-error: true
        run: |
          mkdir -p native tools
          cat > native/vc_mp3.h <<'VC_EOF_0'
          #ifndef VC_MP3_H
          #define VC_MP3_H
          /* Тонкая обёртка над LAME: без JNI, чтобы её можно было проверить отдельно. */
          typedef struct VcMp3 VcMp3;

          /* ch: 1 — моно (сэмплы подряд), 2 — стерео (interleaved). Возвращает NULL при ошибке. */
          VcMp3 *vc_mp3_open(int rate, int ch, int kbps);
          /* Возвращает число записанных байт или отрицательный код ошибки LAME. */
          int vc_mp3_encode(VcMp3 *h, const short *pcm, int frames, unsigned char *out, int outcap);
          int vc_mp3_flush(VcMp3 *h, unsigned char *out, int outcap);
          void vc_mp3_close(VcMp3 *h);
          #endif
          VC_EOF_0
          cat > native/vc_mp3.c <<'VC_EOF_1'
          #include <stdlib.h>
          #include "lame.h"
          #include "vc_mp3.h"

          struct VcMp3 {
              lame_t g;
              int ch;
          };

          VcMp3 *vc_mp3_open(int rate, int ch, int kbps) {
              VcMp3 *h = (VcMp3 *) calloc(1, sizeof(VcMp3));
              if (!h) return NULL;
              h->ch = ch;
              h->g = lame_init();
              if (!h->g) { free(h); return NULL; }
              lame_set_in_samplerate(h->g, rate);
              lame_set_num_channels(h->g, ch);
              lame_set_brate(h->g, kbps);
              lame_set_mode(h->g, ch == 1 ? MONO : JOINT_STEREO);
              lame_set_quality(h->g, 3);
              if (lame_init_params(h->g) < 0) { lame_close(h->g); free(h); return NULL; }
              return h;
          }

          int vc_mp3_encode(VcMp3 *h, const short *pcm, int frames, unsigned char *out, int outcap) {
              if (h->ch == 1)
                  return lame_encode_buffer(h->g, pcm, pcm, frames, out, outcap);
              return lame_encode_buffer_interleaved(h->g, (short *) pcm, frames, out, outcap);
          }

          int vc_mp3_flush(VcMp3 *h, unsigned char *out, int outcap) {
              return lame_encode_flush(h->g, out, outcap);
          }

          void vc_mp3_close(VcMp3 *h) {
              if (!h) return;
              lame_close(h->g);
              free(h);
          }
          VC_EOF_1
          cat > native/vc_mp3_jni.c <<'VC_EOF_2'
          #include <stddef.h>
          #include <stdint.h>
          #include <jni.h>
          #include "vc_mp3.h"

          /* Класс voice.changer.app.Mp3Encoder */

          JNIEXPORT jlong JNICALL Java_voice_changer_app_Mp3Encoder_nOpen(JNIEnv *env, jclass cls, jint rate, jint ch, jint kbps) {
              return (jlong) (intptr_t) vc_mp3_open(rate, ch, kbps);
          }

          JNIEXPORT jint JNICALL Java_voice_changer_app_Mp3Encoder_nEncode(JNIEnv *env, jclass cls, jlong h, jshortArray pcm, jint frames, jbyteArray out) {
              jshort *p = (*env)->GetShortArrayElements(env, pcm, NULL);
              jbyte *o = (*env)->GetByteArrayElements(env, out, NULL);
              jint cap = (*env)->GetArrayLength(env, out);
              int r = vc_mp3_encode((VcMp3 *) (intptr_t) h, (const short *) p, frames, (unsigned char *) o, cap);
              (*env)->ReleaseByteArrayElements(env, out, o, 0);
              (*env)->ReleaseShortArrayElements(env, pcm, p, JNI_ABORT);
              return r;
          }

          JNIEXPORT jint JNICALL Java_voice_changer_app_Mp3Encoder_nFlush(JNIEnv *env, jclass cls, jlong h, jbyteArray out) {
              jbyte *o = (*env)->GetByteArrayElements(env, out, NULL);
              jint cap = (*env)->GetArrayLength(env, out);
              int r = vc_mp3_flush((VcMp3 *) (intptr_t) h, (unsigned char *) o, cap);
              (*env)->ReleaseByteArrayElements(env, out, o, 0);
              return r;
          }

          JNIEXPORT void JNICALL Java_voice_changer_app_Mp3Encoder_nClose(JNIEnv *env, jclass cls, jlong h) {
              vc_mp3_close((VcMp3 *) (intptr_t) h);
          }
          VC_EOF_2
          cat > tools/build-lame.sh <<'VC_EOF_3'
          #!/usr/bin/env bash
          # Собирает libvcmp3.so (кодер MP3: LAME 3.100 + тонкая JNI-обёртка из native/) для Android
          # и кладёт в app/src/main/jniLibs/<abi>/. Нужен интернет и Android NDK (на раннерах GitHub они есть).
          # LAME распространяется под LGPL; библиотека подключается динамически.
          set -euo pipefail

          ROOT="$(cd "$(dirname "$0")/.." && pwd)"
          WORK="$ROOT/build-lame"
          LOG="$WORK/build.log"
          mkdir -p "$WORK"
          : > "$LOG"
          trap 'echo "---- конец журнала сборки LAME ----"; tail -n 60 "$LOG" || true' ERR
          cd "$WORK"

          log() { echo "$*" | tee -a "$LOG"; }

          # ---- исходники LAME (несколько зеркал)
          if ! ls -d lame-3.100 >/dev/null 2>&1; then
            ok=0
            for url in \
              "https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz" \
              "https://deb.debian.org/debian/pool/main/l/lame/lame_3.100.orig.tar.gz" \
              "https://archive.ubuntu.com/ubuntu/pool/main/l/lame/lame_3.100.orig.tar.gz" \
              "https://sourceforge.net/projects/lame/files/lame/3.100/lame-3.100.tar.gz/download"; do
              log "скачиваю: $url"
              if curl -fsSL -A "Mozilla/5.0" --retry 3 --retry-delay 2 --max-time 120 -o lame.tgz "$url" >>"$LOG" 2>&1 \
                 && tar tzf lame.tgz >/dev/null 2>&1; then ok=1; break; fi
              log "  не получилось"
            done
            [ "$ok" = 1 ] || { log "Не удалось скачать исходники LAME ни с одного зеркала"; exit 1; }
            tar xzf lame.tgz
          fi
          LAME="$(ls -d lame-3.100* | grep -v '\.tgz$' | head -n 1)"
          [ -f "$LAME/libmp3lame/lame.c" ] || { log "В архиве нет libmp3lame/lame.c (папка: $LAME)"; exit 1; }
          log "исходники LAME: $LAME"

          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}}"
          [ -n "$NDK" ] && [ -d "$NDK" ] || { log "Android NDK не найден"; exit 1; }
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          log "NDK: $NDK"
          API=26

          # все исходники кодера, кроме декодера mpglib; векторные (x86 SSE) не нужны
          SRC=$(ls "$LAME"/libmp3lame/*.c | grep -v mpglib_interface)

          built=0
          for pair in arm64-v8a:aarch64-linux-android armeabi-v7a:armv7a-linux-androideabi x86_64:x86_64-linux-android; do
            abi="${pair%%:*}"; triple="${pair##*:}"
            CC="$TC/${triple}${API}-clang"
            [ -x "$CC" ] || { log "нет компилятора $CC"; exit 1; }
            OUT="$ROOT/app/src/main/jniLibs/$abi"
            mkdir -p "$OUT"
            log "== $abi"
            "$CC" -shared -fPIC -O2 -fno-strict-aliasing -std=gnu99 -w \
              -DSTDC_HEADERS=1 -DHAVE_STDINT_H=1 -DHAVE_LIMITS_H=1 -DHAVE_STRING_H=1 -DLAME_LIBRARY_BUILD=1 -DNDEBUG \
              -Wl,-z,max-page-size=16384 \
              -I "$LAME/include" -I "$LAME/libmp3lame" -I "$LAME" -I "$ROOT/native" \
              -o "$OUT/libvcmp3.so" \
              "$ROOT/native/vc_mp3.c" "$ROOT/native/vc_mp3_jni.c" $SRC -lm >>"$LOG" 2>&1
            "$TC/llvm-strip" --strip-unneeded "$OUT/libvcmp3.so" >>"$LOG" 2>&1 || true
            built=$((built+1))
          done
          log "Собрано библиотек: $built"
          ls -la "$ROOT"/app/src/main/jniLibs/*/libvcmp3.so | tee -a "$LOG"
          VC_EOF_3
          bash tools/build-lame.sh

      - name: Upload MP3 build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lame-log
          path: build-lame/build.log
          if-no-files-found: ignore

      # Debug-APK подписан отладочным ключом и ставится на телефон без дополнительных шагов
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceChanger-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ---- Подписанный релиз (необязательно) ----
      # Включается, если в Settings → Secrets and variables → Actions заданы:
      # KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Check signing secrets
        id: keys
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "signed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Build release APK
        if: steps.keys.outputs.signed == 'true'
        run: gradle assembleRelease --no-daemon --console=plain

      - name: Sign release APK
        if: steps.keys.outputs.signed == 'true'
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          mkdir -p signed
          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk signed/aligned.apk
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KS_PASS \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS \
            --out signed/VoiceChanger-1.0.apk signed/aligned.apk
          "$BT/apksigner" verify signed/VoiceChanger-1.0.apk
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload signed APK
        if: steps.keys.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: VoiceChanger-release
          path: signed/VoiceChanger-1.0.apk
          if-no-files-found: error
